services:
  # PostgreSQL 16 — данные кампаний (схема по ТЗ, миграции применяет API)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adcamp
      POSTGRES_USER: adcamp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adcamp}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adcamp -d adcamp"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    ports: ["8080:8080"]
    volumes:
      - ./data/mock:/data/mock:ro
    environment:
      PORT: 8080
      MOCK_DIR: /data/mock
      DATABASE_URL: postgres://adcamp:${DB_PASSWORD:-adcamp}@db:5432/adcamp?sslmode=disable
      AUTH_REQUIRED: "1"                                     # писать в API — только после входа
      AUTH_SECRET: ${AUTH_SECRET:-sber-ad-dev-secret-change-me}
      SERVICE_KEY: ${SERVICE_KEY:-sber-ad-service-key}      # агент действует от имени вошедшего
    depends_on:
      db:
        condition: service_healthy

  agent:
    build: ./agent
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://api:8080
      SESSIONS_FILE: /state/sessions.json   # история диалогов ассистента
      AUTH_REQUIRED: "1"
      SERVICE_KEY: ${SERVICE_KEY:-sber-ad-service-key}
    volumes:
      - agent-state:/state
      - ./certs:/certs:ro   # сертификат Минцифры для GigaChat (GIGACHAT_CA_BUNDLE)
    depends_on: [api]

  web:
    build:
      context: ./web
      args:
        VITE_AGENT_URL: http://localhost:8000
        VITE_API_URL: http://localhost:8080
    ports: ["3000:80"]
    depends_on: [agent, api]

volumes:
  db-data:
  agent-state:
